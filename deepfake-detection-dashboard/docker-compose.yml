services:
  backend:
    build: ./backend
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 5000
      FRONTEND_ORIGINS: http://localhost:8080
      DEVICE: auto
    volumes:
      - ./backend/artifacts:/app/artifacts:ro
    ports:
      - "5000:5000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

